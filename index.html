<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#111"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="OSC Console"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/icon-192.png"><link rel="stylesheet" href="./styles.css"><title>OSC Console</title></head><body>
<main class="app-shell"><header><div><p class="eyebrow">OSC CONTROL SURFACE</p><h1>OSC Console</h1></div><div class="header-actions"><button id="lockButton" class="icon-button" aria-label="操作ロック">🔓</button><button id="settingsButton" class="icon-button" aria-label="設定">⚙</button></div></header>
<section class="status-card"><span id="statusDot" class="status-dot"></span><div><strong id="statusText">オフライン</strong><small id="statusDetail">UI確認モード</small></div><button id="connectButton" class="secondary-button">設定</button></section>
<nav id="customToolbar" class="custom-toolbar hidden" aria-label="カスタム操作"><div class="segmented"><button class="active" data-view="channels">CH</button><button data-view="dca">DCA</button></div><div id="bankControls"><button id="prevBank" aria-label="前のバンク">‹</button><span id="bankLabel">BANK 1</span><button id="nextBank" aria-label="次のバンク">›</button></div></nav>
<section id="faders" class="faders" aria-label="OSCフェーダー"></section>
<footer><span id="lockHint">タップでロック</span><span id="sendRate">0 msg/s</span><span>v2.0.0</span></footer></main>
<dialog id="settingsDialog"><form id="settingsForm" novalidate><div class="dialog-heading"><div><p class="eyebrow">CONFIGURATION</p><h2>設定</h2></div><button type="button" id="closeSettings" class="icon-button">×</button></div>
<div class="settings-tabs"><button type="button" class="active" data-tab="basic">基本</button><button type="button" data-tab="patch">OSCパッチ</button></div>
<section class="tab-panel" data-panel="basic"><label>UIモード<select id="uiMode"><option value="simple">シンプル</option><option value="custom">カスタム</option></select></label><label>接続モード<select id="connectionMode"><option value="offline">オフライン</option><option value="local">同一LAN</option><option value="cloud">クラウド中継</option></select></label>
<div id="cloudFields" class="field-group hidden"><label>Worker URL<input id="serverUrl" type="text" placeholder="https://your-worker.workers.dev"></label><label>ルームコード<input id="roomCode" type="text" maxlength="32" placeholder="studio-a-8f29c4"></label></div>
<div id="localFields" class="field-group hidden"><label>ローカルWebSocket<input id="localUrl" type="text" placeholder="ws://192.168.1.20:8080/ws"></label><p class="notice">PCのローカルページ http://PCのIP:8080 を開けば、空欄で自動接続します。</p></div>
<div class="two-col"><label>OSC送信先IP<input id="oscHost" type="text" placeholder="127.0.0.1"></label><label>Port<input id="oscPort" type="number" min="1" max="65535" inputmode="numeric"></label></div><p class="helper">数値制御は規約に合わせ、初期値を高頻度通信用の3336にしています。</p>
<label>追従のやわらかさ <output id="easeOutput">180 ms</output><input id="easeMs" type="range" min="0" max="600" step="10"></label><label>チャンネル数（カスタム）<input id="channelCount" type="number" min="1" max="32" inputmode="numeric"></label>
<label class="switch-row"><span><strong>操作音</strong><small>消音モード解除後に有効</small></span><input id="soundEnabled" type="checkbox"></label><label class="switch-row"><span><strong>起動時にロック</strong><small>長押しで解除</small></span><input id="startLocked" type="checkbox"></label><label class="switch-row"><span><strong>画面スリープ防止</strong></span><input id="wakeEnabled" type="checkbox"></label></section>
<section class="tab-panel hidden" data-panel="patch"><p class="notice">Addressは小文字・スラッシュ区切り・英数字とハイフンのみ。無効な設定は送信しません。</p><div id="patchList" class="patch-list"></div></section>
<p id="settingsError" class="error-text" role="alert"></p><button class="primary-button" type="submit">保存して適用</button></form></dialog>
<dialog id="valueDialog"><form id="valueForm" novalidate><div class="dialog-heading"><div><p class="eyebrow">DIRECT VALUE</p><h2 id="valueTitle">値を指定</h2></div><button type="button" id="closeValue" class="icon-button">×</button></div><label>送信値<input id="directValue" type="number" inputmode="decimal"></label><p id="valueRange" class="helper"></p><p class="notice">入力中は送信されません。「値を適用」を押したときだけ反映します。</p><p id="valueError" class="error-text"></p><button class="primary-button" type="submit">値を適用</button></form></dialog>
<script src="./app.js" defer></script></body></html>
