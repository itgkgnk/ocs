<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#191919">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OSC Fader">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>OSC Fader</title>
</head>
<body>
  <main class="app-shell">
    <header><div><p class="eyebrow">WEB OSC CONTROLLER</p><h1>OSC Fader</h1></div><button id="settingsButton" class="icon-button" aria-label="接続設定">⚙</button></header>
    <section class="status-card" aria-live="polite"><span id="statusDot" class="status-dot"></span><div><strong id="statusText">未接続</strong><small id="roomText">接続設定を開いてください</small></div><button id="connectButton" class="secondary-button">接続</button></section>
    <section class="faders" aria-label="OSCフェーダー">
      <article class="fader-card" data-channel="1"><div class="fader-heading"><span>CH 1</span><output>50</output></div><div class="fader-zone"><div class="ticks" aria-hidden="true"></div><input class="vertical-fader" type="range" min="0" max="100" value="50" step="1" aria-label="チャンネル1"></div><button class="reset-button">CENTER</button></article>
      <article class="fader-card" data-channel="2"><div class="fader-heading"><span>CH 2</span><output>50</output></div><div class="fader-zone"><div class="ticks" aria-hidden="true"></div><input class="vertical-fader" type="range" min="0" max="100" value="50" step="1" aria-label="チャンネル2"></div><button class="reset-button">CENTER</button></article>
      <article class="fader-card" data-channel="3"><div class="fader-heading"><span>CH 3</span><output>50</output></div><div class="fader-zone"><div class="ticks" aria-hidden="true"></div><input class="vertical-fader" type="range" min="0" max="100" value="50" step="1" aria-label="チャンネル3"></div><button class="reset-button">CENTER</button></article>
      <article class="fader-card" data-channel="4"><div class="fader-heading"><span>CH 4</span><output>50</output></div><div class="fader-zone"><div class="ticks" aria-hidden="true"></div><input class="vertical-fader" type="range" min="0" max="100" value="50" step="1" aria-label="チャンネル4"></div><button class="reset-button">CENTER</button></article>
    </section>
    <footer><button id="resetAllButton" class="footer-button" type="button">全CHを50へ</button><span id="sendRate">0 msg/s</span><span>v1.2.0</span></footer>
  </main>
  <dialog id="settingsDialog"><form method="dialog" id="settingsForm" novalidate>
    <div class="dialog-heading"><div><p class="eyebrow">CONNECTION</p><h2>接続設定</h2></div><button type="button" id="closeSettings" class="icon-button" aria-label="閉じる">×</button></div>
    <label>接続モード<select id="connectionMode"><option value="offline">オフライン（UI確認）</option><option value="local">同一LAN</option><option value="cloud">クラウド中継</option></select></label>
    <div id="cloudFields" class="mode-fields hidden"><label>WebSocket URL<input id="serverUrl" type="text" inputmode="url" placeholder="https://your-worker.workers.dev"></label><label>ルームコード<input id="roomCode" type="text" maxlength="32" placeholder="studio-a-8f29c4"></label></div>
    <div id="localFields" class="mode-fields hidden"><label>ローカルWebSocket URL<input id="localUrl" type="text" inputmode="url" placeholder="ws://192.168.1.20:8080/ws"></label><p class="notice">同一LANモードでは、PCが配信する http://PCのIP:8080 をスマホで開きます。</p></div>
    <label class="switch-row"><span><strong>操作音</strong><small>消音モード解除後、最初のタッチで有効化</small></span><input id="soundEnabled" type="checkbox" checked></label>
    <label class="switch-row"><span><strong>画面スリープ防止</strong><small>対応端末で操作中の画面を維持</small></span><input id="wakeLockEnabled" type="checkbox" checked></label>
    <p id="settingsError" class="error-text" role="alert"></p><button id="saveButton" class="primary-button">保存して適用</button>
  </form></dialog>
  <script src="./app.js" defer></script>
</body>
</html>
